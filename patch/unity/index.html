<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; frame-ancestors *; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; object-src 'none';">
  <title>Kingdom Rush Unblocked</title>
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="patch/unity/TemplateData/style.css">
  <script src="patch/unity/TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <script>
    // Block all external redirects
    window.addEventListener('beforeunload', function(e) {
      if (window.location.href !== window.initialUrl && !window.location.href.startsWith(window.location.origin)) {
        e.preventDefault();
        return false;
      }
    });
    
    window.initialUrl = window.location.href;
    
    // Override window.open to prevent popups
    window.open = function() { return null; };
    
    // Override location changes
    Object.defineProperty(window, 'location', {
      get: function() { return window.location; },
      set: function(url) {
        if (url.indexOf('gitlab') > -1 || url.indexOf('github') > -1) {
          console.warn('[Security] Blocked external redirect to:', url);
          return;
        }
      }
    });
    
    function fixGameView() {
      const gameView= document.getElementById("gameView");
      if (gameView.clientHeight> gameView.clientWidth) {
        gameView.style.height= Math.floor(gameView.clientWidth)+ "px";
      }
    }
    
    var gameInstance = UnityLoader.instantiate(
      "gameContainer",
      "Build/GD.json", {
        onProgress: UnityProgress,
        Module:{
          onRuntimeInitialized: function() {
            UnityProgress(gameInstance, "complete")
          }
        }
      });
  </script>
</head>
<body style="overflow:hidden; margin:0; padding:0;" onload="fixGameView()">
  <div id="gameView" class="webgl-content" style="overflow:hidden; width:100%; height:100%; margin:0; padding:0; position:absolute;">
    <div id="gameContainer" style="width: 100%; height: 100%;"></div>
  </div>
</body>
</html>
